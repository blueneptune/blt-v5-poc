[project]
name = "blt"
version = "2026.10.30"
description = "Commvault job-history collector: per-CommCell collection script, FastAPI ingest API, Postgres store."
requires-python = ">=3.12"
# Only what both halves share (the API schemas in blt.schemas). Everything
# else lives behind an extra so the API container never needs the
# collector's git dependency, and a collector host never needs Postgres
# drivers.
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]
collector = [
    "commvault-sdk",
    "rubrik-sdk",
    "sdk-primer",
]
# The orchestration layer: flows, blocks, and the worker that runs them.
# Installed in the worker image; builds on the collector.
prefect = [
    "blt[collector]",
    "prefect>=3.4",
]

[project.scripts]
blt-collect = "blt.collector.cli:main"
blt-migrate = "blt.api.migrate:main"
blt-lookup = "blt.collector.lookup:main"
blt-prefect-import = "blt.flows.importer:main"
blt-prefect-block = "blt.flows.manage:main"
blt-rubrik = "blt.rubrik.cli:main"
blt-openapi = "blt.api.openapi:main"

[tool.uv.sources]
sdk-primer = { git = "https://github.com/blueneptune/sdk-primer-core.git", tag = "v0.1.2" }
# blt's Commvault SDK, in its own repository (yoki-py-commvault-sdk),
# pinned to a tag like sdk-primer. To work on both at once, point this at
# a sibling checkout instead:
#   commvault-sdk = { path = "../yoki-py-commvault-sdk", editable = true }
commvault-sdk = { git = "https://github.com/blueneptune/yoki-py-commvault-sdk.git", tag = "v0.3.1" }
# The Rubrik SDK (yoki-py-rubrik-sdk), pinned to a tag like the others.
rubrik-sdk = { git = "https://github.com/blueneptune/yoki-py-rubrik-sdk.git", tag = "v0.3.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blt"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query() as parameter defaults - see sdk-primer-v2's
# examples/user-service for the same exemption.
"src/blt/api/*.py" = ["B008"]
# Alembic-generated; long lines are how it writes them.
"src/blt/migrations/versions/*.py" = ["E501"]

[tool.mypy]
plugins = ["pydantic.mypy"]
files = ["src"]
# Alembic-generated; not worth type-checking.
exclude = ["src/blt/migrations/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
