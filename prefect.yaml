# blt's deployments: which flows run, when, and on which work pool. The
# worker container registers these each time it starts
# (deploy/prefect/worker/start.sh), so changing a schedule here takes
# effect with the next image. Schedules are in UTC.
name: blt
prefect-version: 3.8.8

# The code is already in the worker image; a flow run only has to start
# in the right directory.
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

deployments:
  - name: hourly
    description: Jobs from every CommCell block - what `collect.sh <commcell>` does.
    entrypoint: blt.flows.flows:collect_jobs
    work_pool:
      name: blt
    schedules:
      - cron: "7 * * * *"
        timezone: UTC

  - name: twice-daily
    description: Inventory from every CommCell block - what `collect.sh <commcell> --inventory` does.
    entrypoint: blt.flows.flows:collect_inventory
    work_pool:
      name: blt
    schedules:
      - cron: "37 5,17 * * *"
        timezone: UTC

  # One CommCell each, no schedule: the parents above start one of these
  # per CommCell block, all at once. Can also be run by hand.
  - name: per-commcell
    description: Jobs from one CommCell. Started by blt-collect-jobs/hourly.
    entrypoint: blt.flows.flows:collect_commcell
    work_pool:
      name: blt

  - name: per-commcell
    description: Inventory from one CommCell. Started by blt-collect-inventory/twice-daily.
    entrypoint: blt.flows.flows:inventory_commcell
    work_pool:
      name: blt

  - name: by-hand
    description: One CommCell's older history, until complete. Run it from the UI with the CommCell's name.
    entrypoint: blt.flows.flows:backfill
    work_pool:
      name: blt
