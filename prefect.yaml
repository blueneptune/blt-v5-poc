# blt's deployments: which flows run, when, and on which work pool. The
# worker container registers these each time it starts
# (deploy/prefect/worker/start.sh), so changing a schedule here takes
# effect with the next image. Schedules are in UTC.
name: blt
prefect-version: 3.8.8

# The code is already in the worker image; a flow run only has to start
# in the right directory.
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

deployments:
  - name: hourly
    description: Jobs from every CommCell block - what `collect.sh <commcell>` does.
    entrypoint: blt.flows.flows:collect_jobs
    work_pool:
      name: blt
    schedules:
      - cron: "7 * * * *"
        timezone: UTC

  - name: twice-daily
    description: Inventory from every CommCell block - what `collect.sh <commcell> --inventory` does.
    entrypoint: blt.flows.flows:collect_inventory
    work_pool:
      name: blt
    schedules:
      - cron: "37 5,17 * * *"
        timezone: UTC

  # One CommCell each, no schedule: the parents above start one of these
  # per CommCell block, all at once. Can also be run by hand.
  - name: per-commcell
    description: Jobs from one CommCell. Started by blt-collect-jobs/hourly.
    entrypoint: blt.flows.flows:collect_commcell
    work_pool:
      name: blt

  - name: per-commcell
    description: Inventory from one CommCell. Started by blt-collect-inventory/twice-daily.
    entrypoint: blt.flows.flows:inventory_commcell
    work_pool:
      name: blt

  # Rubrik: every account block hourly, ten minutes after Commvault so
  # the two do not start at the same moment; one account each below.
  - name: hourly
    description: Jobs from every Rubrik account block - what `blt-rubrik collect <name>` does.
    entrypoint: blt.flows.rubrik:rubrik_collect_jobs
    work_pool:
      name: blt
    schedules:
      - cron: "17 * * * *"
        timezone: UTC

  - name: per-account
    description: Jobs from one Rubrik account. Started by blt-rubrik-collect-jobs/hourly.
    entrypoint: blt.flows.rubrik:rubrik_collect_account
    work_pool:
      name: blt

  # Rubrik inventory: twice a day, ten minutes after Commvault's.
  - name: twice-daily
    description: Inventory from every Rubrik account block - what `blt-rubrik inventory <name>` does.
    entrypoint: blt.flows.rubrik:rubrik_collect_inventory
    work_pool:
      name: blt
    schedules:
      - cron: "47 5,17 * * *"
        timezone: UTC

  - name: per-account
    description: Inventory from one Rubrik account. Started by blt-rubrik-collect-inventory/twice-daily.
    entrypoint: blt.flows.rubrik:rubrik_inventory_account
    work_pool:
      name: blt

  # Storage: every CommCell's pools hourly, at :27 - between Commvault's
  # jobs (:07) and Rubrik's (:17) runs finishing and the next hour's.
  - name: hourly
    description: Storage pools, capacity and use, from every CommCell block (docs/storage.md).
    entrypoint: blt.flows.flows:collect_storage
    work_pool:
      name: blt
    schedules:
      - cron: "27 * * * *"
        timezone: UTC

  - name: per-commcell
    description: Storage from one CommCell. Started by blt-collect-storage/hourly.
    entrypoint: blt.flows.flows:storage_commcell
    work_pool:
      name: blt

  # NetBackup: every primary block's storage hourly, with Commvault's.
  - name: hourly
    description: Storage (disk pools, capacity and use) from every NetBackup primary block.
    entrypoint: blt.flows.netbackup:netbackup_collect_storage
    work_pool:
      name: blt
    schedules:
      - cron: "27 * * * *"
        timezone: UTC

  - name: per-primary
    description: Storage from one NetBackup primary. Started by blt-netbackup-collect-storage/hourly.
    entrypoint: blt.flows.netbackup:netbackup_storage_primary
    work_pool:
      name: blt

  # Started from blt's Administration pages, never on a schedule.
  - name: by-hand
    description: Checks one NetBackup primary's API key and each read blt makes. Started from Administration -> Sources.
    entrypoint: blt.flows.netbackup:netbackup_check
    work_pool:
      name: blt

  - name: by-hand
    description: Fetches a NetBackup primary's CA certificate, by address, with its fingerprint. Started from Administration -> Sources.
    entrypoint: blt.flows.netbackup:netbackup_fetch_ca
    work_pool:
      name: blt

  - name: by-hand
    description: One CommCell's older history, until complete. Run it from Administration -> Schedules with the CommCell's name.
    entrypoint: blt.flows.flows:backfill
    work_pool:
      name: blt
