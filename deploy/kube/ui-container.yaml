
    - name: ui
      image: localhost/blt-ui:latest
      imagePullPolicy: Never
      env:
        - {name: HOST, value: "${UI_LISTEN_HOST}"}
        - {name: PORT, value: "${UI_LISTEN_PORT}"}
        - {name: BLT_API_URL, value: "http://${API_IN_POD}:${API_LISTEN_PORT}"}
        - name: BLT_API_KEY
          valueFrom: {secretKeyRef: {name: blt-secrets, key: BLT_API_KEY}}
      ports:
        - {containerPort: ${UI_LISTEN_PORT}, hostPort: ${UI_PORT}, hostIP: "${UI_BIND}"}
